# ============================================================
# Promtail — tails Docker container logs and ships them to Loki.
#
# ONE scrape_config on purpose. Promtail's docker_sd_configs opens a tailer for
# every discovered container in EVERY scrape_config, and relabel `keep`/`drop`
# does not stop the tailer — it only prevents the labels from being built. With
# three scrape_configs, each container was tailed three times: once with correct
# labels, and twice with NO labels at all. Loki rejects a label-less stream
# ("at least one label pair is required per stream") and Promtail retries
# forever, which produced ~98% of all Loki and Promtail log output.
#
# So: discover once, assign the job label by relabel cascade, and branch the
# parsing with pipeline `match` stages instead.
#
# Label discipline matters: Loki indexes LABELS, not log content. Only
# low-cardinality values belong here. requestId is deliberately NOT a label
# (it would create one stream per request); it is extracted as structured
# metadata and stays searchable via `| requestId="..."`.
# ============================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  - job_name: bm
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.project"]

    relabel_configs:
      # Floor: only containers managed by Compose. Anything else (a stray
      # `docker run`) has no com.docker.compose.* labels, so every rule below
      # would resolve empty and produce exactly the label-less stream this
      # config exists to avoid.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: '.+'
        action: keep

      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(.*)'
        target_label: 'container'

      # job label by cascade: default to bm-infra, then override for the
      # services that get bespoke parsing. `replace` only applies when the
      # regex matches, so order gives us if/else-if/else. These three values
      # are what the Grafana dashboards query, so they must not change.
      - target_label: 'job'
        replacement: 'bm-infra'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: 'backend-(prod|qa)'
        target_label: 'job'
        replacement: 'bm-backend'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: 'nginx'
        target_label: 'job'
        replacement: 'bm-nginx'

    pipeline_stages:

      # ─── Ktor backends: structured JSON from the logback encoder ───
      - match:
          selector: '{job="bm-backend"}'
          stages:
            - json:
                expressions:
                  level: level
                  logger: logger
                  env: env
                  requestId: requestId
                  method: method
                  path: path
                  message: message
                  stack_trace: stack_trace
                  timestamp: timestamp
                  # Business context emitted via StructuredArguments.kv().
                  # High cardinality, so these become structured metadata below
                  # rather than labels — as labels they would create a stream
                  # per user or per job and cripple Loki.
                  userId: userId
                  userEmail: userEmail
                  jobId: jobId
                  fileName: fileName
                  payloadBytes: payloadBytes
            # Use the application's own timestamp, not ingestion time, so a
            # delayed shipment does not distort the graphs.
            - timestamp:
                source: timestamp
                format: RFC3339Nano
                action_on_failure: fudge
            - labels:
                level:
                env:
            - structured_metadata:
                requestId:
                logger:
                method:
                path:
                userId:
                userEmail:
                jobId:
                fileName:
                payloadBytes:
            # Re-attach the stack trace to the message. The `output` stage
            # REPLACES the log line with a single field, so without this an
            # exception would reach Loki as its one-line message with the trace
            # silently dropped — defeating the point of logging traces at all.
            - template:
                source: message
                template: '{{ if .stack_trace }}{{ .message }}{{ "\n" }}{{ .stack_trace }}{{ else }}{{ .message }}{{ end }}'
            - output:
                source: message

      # ─── Nginx: JSON access logs (see nginx.conf log_format bm_json) ───
      - match:
          selector: '{job="bm-nginx"}'
          stages:
            # error_log lines are plain text, so parse failures are tolerated.
            - json:
                expressions:
                  requestId: requestId
                  method: method
                  path: path
                  status: status
                  requestTimeSeconds: requestTimeSeconds
                  timestamp: timestamp
            - timestamp:
                source: timestamp
                format: RFC3339
                action_on_failure: fudge
            - structured_metadata:
                requestId:
                method:
                path:
                status:

      # ─── Everything else: Docling, n8n, Postgres, and the monitoring stack ───
      - match:
          selector: '{job="bm-infra"}'
          stages:
            # Best-effort level extraction so `level` filtering works across the
            # whole stack, not just the backends.
            - regex:
                expression: '(?i)(?P<level>\b(TRACE|DEBUG|INFO|WARN(?:ING)?|ERROR|FATAL|CRITICAL)\b)'
            - labels:
                level:
