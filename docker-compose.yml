# ============================================================
# BM unified stack — Phase 1 (local) / Phase 2 (VPS)
#
# Shared infra : Docling API, Docling Price Tables, Postgres, Nginx
# Isolated     : backend-prod / backend-qa, n8n-prod / n8n-qa
#
# Build contexts are relative to THIS file (docker/), so they point
# one level up at the real repos on this machine:
#   ../BmBackEnd          -> bm/backend:prod image (main branch checkout)
#   ../BmBackEnd-qa       -> bm/backend:qa image   (qa branch checkout; clone
#                            with `git clone -b qa <BmBackEnd-url> ../BmBackEnd-qa`
#                            if you want to build QA locally)
#   ../DoclingBillReader  -> bm/docling image
#
# Image sharing: docling-price-tables reuses the image built by docling-api
# (no second build). backend-prod / backend-qa use separate image tags so
# QA can run different code than PROD.
#
# Usage:
#   docker compose build
#   docker compose up -d
#   docker compose up -d backend-prod n8n-prod      # PROD only
#   docker compose up -d backend-qa  n8n-qa         # QA only
# ============================================================

# Docker's json-file driver is UNBOUNDED by default and is the most common cause
# of a full disk on a long-running host. Capped here for every service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ─── SHARED: Docling (built once, used by all environments) ───

  docling-api:
    image: bm/docling:latest
    build:
      context: ../DoclingBillReader
      dockerfile: Dockerfile
    command: ["python", "docling_customer_data_extraction_api_server.py"]
    ports:
      - "5000:5000"
    volumes:
      - docling-models:/app/models
      - docling-temp:/app/temp
      - docling-uploads:/app/uploads
      - docling-logs:/app/logs
    environment:
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
      # Corporate network breaks HF Xet CDN range requests (HTTP 416);
      # force plain LFS HTTPS downloads from huggingface.co instead.
      - HF_HUB_DISABLE_XET=1
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - bm-network

  docling-price-tables:
    image: bm/docling:latest          # reuses the image built by docling-api
    command: ["python", "docling_price_tables_extraction_api_server.py"]
    ports:
      - "5001:5001"
    volumes:
      - docling-models:/app/models
      - docling-temp:/app/temp
      - docling-uploads:/app/uploads
      - docling-logs:/app/logs
    environment:
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
      - PORT=5001
      # Corporate network breaks HF Xet CDN range requests (HTTP 416);
      # force plain LFS HTTPS downloads from huggingface.co instead.
      - HF_HUB_DISABLE_XET=1
    depends_on:
      docling-api:
        condition: service_healthy   # ensures the image is built first
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - bm-network

  # ─── SHARED: Postgres (single instance, bm_backend + bm_qa databases) ───

  postgres:
    image: postgres:16-alpine
    container_name: bm-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: bm_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      # POSTGRES_DB intentionally omitted; databases are created by the init script.
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bm_app"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bm-network

  # ─── PROD: Backend ───

  backend-prod:
    image: bm/backend:prod
    build:
      context: ../BmBackEnd
      dockerfile: Dockerfile
    container_name: bm-backend-prod
    ports:
      - "8081:8081"
    logging: *default-logging
    environment:
      - KTOR_ENV=production
      # Observability: structured JSON logs tagged with the environment, so a
      # single Loki/Grafana can serve both PROD and QA.
      - BM_ENV=prod
      - SERVICE_NAME=bm-backend
      # Overridable from .env so logging can be rolled back to plain text, or
      # temporarily raised to DEBUG, without editing a tracked file on the VPS.
      - LOG_FORMAT=${PROD_LOG_FORMAT:-json}
      - LOG_LEVEL=${PROD_LOG_LEVEL:-INFO}
      # NOTE: sslmode=disable is required — the postgres:16-alpine container has no TLS,
      # and DataSourceFactory forces sslmode=require unless the URL overrides it.
      - DB_URL=jdbc:postgresql://postgres:5432/bm_backend?sslmode=disable
      - DB_USER=bm_app
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - BM_ENCRYPTION_KEY=${BM_ENCRYPTION_KEY:?BM_ENCRYPTION_KEY must be set}
      - DOCLING_CUSTOMER_API_URL=http://docling-api:5000
      - DOCLING_PRICE_TABLES_API_URL=http://docling-price-tables:5001
      - N8N_FETCH_USER_CONSUMPTION_WEBHOOK_URL=http://n8n-prod:5678/webhook/fetch-user-consumption
      - N8N_FETCH_TOTAL_PRICES_WEBHOOK_URL=http://n8n-prod:5678/webhook/fetch-total-prices
      # Firebase auth (optional locally). To enable, drop the JSON at
      # ../BmBackEnd/firebase-service-account.json, set the path below, and
      # uncomment the matching volume mount. Auth endpoints fail without it,
      # but the app still starts (Firebase init is lazy).
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/firebase-service-account.json
    volumes:
      - ../brielmarnysos-1dc68-firebase-adminsdk-fbsvc-3e2586a86a.json:/app/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      docling-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bm-network

  # ─── PROD: n8n ───

  n8n-prod:
    image: bm/n8n:latest
    build:
      context: ../DoclingBillReader
      dockerfile: Dockerfile.n8n
    container_name: bm-n8n-prod
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PROD_PASSWORD:?N8N_PROD_PASSWORD must be set}
      - DOCLING_API_URL=http://docling-api:5000
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - N8N_SECURE_COOKIE=false
      - DB_TYPE=sqlite
    volumes:
      - n8n-prod-data:/home/node/.n8n
    depends_on:
      docling-api:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    networks:
      - bm-network

  # ─── QA: Backend (own image tag bm/backend:qa, built from ../BmBackEnd-qa) ───

  backend-qa:
    image: bm/backend:qa
    build:
      context: ../BmBackEnd-qa
      dockerfile: Dockerfile
    container_name: bm-backend-qa
    ports:
      - "9081:8081"
    logging: *default-logging
    environment:
      - KTOR_ENV=production
      # Same code as PROD; only these values differ (see MONITORING_PLAN.md §5).
      - BM_ENV=qa
      - SERVICE_NAME=bm-backend
      - LOG_FORMAT=${QA_LOG_FORMAT:-json}
      - LOG_LEVEL=${QA_LOG_LEVEL:-DEBUG}
      - DB_URL=jdbc:postgresql://postgres:5432/bm_qa?sslmode=disable
      - DB_USER=bm_app
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - BM_ENCRYPTION_KEY=${BM_ENCRYPTION_KEY:?BM_ENCRYPTION_KEY must be set}
      - DOCLING_CUSTOMER_API_URL=http://docling-api:5000
      - DOCLING_PRICE_TABLES_API_URL=http://docling-price-tables:5001
      - N8N_FETCH_USER_CONSUMPTION_WEBHOOK_URL=http://n8n-qa:5678/webhook/fetch-user-consumption
      - N8N_FETCH_TOTAL_PRICES_WEBHOOK_URL=http://n8n-qa:5678/webhook/fetch-total-prices
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/firebase-service-account.json
    volumes:
      - ../brielmarnysos-1dc68-firebase-adminsdk-fbsvc-3e2586a86a.json:/app/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      docling-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bm-network

  # ─── QA: n8n ───

  n8n-qa:
    image: bm/n8n:latest             # reuses the image built by n8n-prod
    container_name: bm-n8n-qa
    ports:
      - "6678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_QA_PASSWORD:?N8N_QA_PASSWORD must be set}
      - DOCLING_API_URL=http://docling-api:5000
      - WEBHOOK_URL=http://localhost:6678/
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - N8N_SECURE_COOKIE=false
      - DB_TYPE=sqlite
    volumes:
      - n8n-qa-data:/home/node/.n8n
    depends_on:
      docling-api:
        condition: service_healthy
      n8n-prod:
        condition: service_started    # ensures bm/n8n:latest is built first
    logging: *default-logging
    restart: unless-stopped
    networks:
      - bm-network

  # ─── SHARED: Nginx ───
  # :80  -> PROD backend (catch-all) + ACME challenges
  # :443 -> QA backend via api.qa.poweredbyadvisors.com (Let's Encrypt)
  # :81  -> QA backend (legacy port-based). n8n is reached directly on its
  # published ports (5678 / 6678).

  nginx:
    image: nginx:alpine
    container_name: bm-nginx
    ports:
      - "8090:80"    # -> backend-prod  (host 80 is often already in use)
      - "8091:81"    # -> backend-qa
      - "8443:443"   # -> backend-qa via api.qa.* (HTTPS)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # ACME webroot for Let's Encrypt (certbot runs on the host with the
      # webroot plugin; the challenge files land here).
      - /var/www/certbot:/var/www/certbot:ro
      # Let's Encrypt certificates (issued/renewed by certbot on the host).
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend-prod
      - backend-qa
    logging: *default-logging
    restart: unless-stopped
    networks:
      - bm-network

  # ─── OBSERVABILITY: Loki + Promtail + Grafana (MONITORING_PLAN.md Phase 1) ───
  # Loki stores logs, Promtail ships them from every container, Grafana is the
  # UI. All three bind to 127.0.0.1 only: never expose them to the internet.

  loki:
    image: grafana/loki:3.1.1
    container_name: bm-loki
    # Loopback only. Reach it through Grafana, or via an SSH tunnel.
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    user: "10001:10001"
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - bm-network

  promtail:
    image: grafana/promtail:3.1.1
    container_name: bm-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Read-only Docker socket: Promtail discovers containers and reads their
      # logs through the API, so it needs no access to the host filesystem.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    logging: *default-logging
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bm-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: bm-grafana
    # Loopback only: reach it with
    #   ssh -L 3000:127.0.0.1:3000 <user>@<vps>
    # then open http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      # No public sign-up, no anonymous access.
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_LOG_LEVEL=warn
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    logging: *default-logging
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - bm-network

volumes:
  docling-models:
  docling-temp:
  docling-uploads:
  docling-logs:
  pg-data:
  n8n-prod-data:
  n8n-qa-data:
  loki-data:
  promtail-positions:
  grafana-data:

networks:
  bm-network:
    driver: bridge
