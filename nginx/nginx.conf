# ============================================================
# Routing:
#   :80  server_name api.qa.poweredbyadvisors.com -> HTTPS redirect (QA)
#   :80  server_name api.poweredbyadvisors.com    -> HTTPS redirect (PROD)
#   :443 api.qa.* / api.*                         -> QA / PROD backend (TLS)
#   :80  default (catch-all, raw IP)              -> ACME challenges only, else 444
#   :81  port-based QA (loopback-published only)  -> QA   backend (backend-qa:8081)
#
# /.well-known/acme-challenge/ is served from /var/www/certbot so certbot
# (webroot plugin, run on the host) can issue Let's Encrypt certificates.
#
# n8n-only endpoints (batch-process-price-tables, consumption-report) are
# denied in every block that proxies to a backend.
#
# :443 n8n.* / n8n.qa.* -> n8n-prod / n8n-qa editors. Public /webhook*/
#      paths are denied: the backend calls n8n over bm-network.
# ============================================================

events {
    worker_connections 1024;
}

http {
    sendfile on;
    client_max_body_size 50M;

    # The default 'combined' format omits $request_id, which would make Nginx
    # the one hop in the chain that cannot be correlated with the rest. Logged
    # as JSON so Promtail parses it into fields instead of regex-matching text.
    log_format bm_json escape=json
        '{'
        '"timestamp":"$time_iso8601",'
        '"requestId":"$request_id",'
        '"remoteAddr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bodyBytesSent":$body_bytes_sent,'
        '"requestTimeSeconds":$request_time,'
        '"upstreamAddr":"$upstream_addr",'
        '"upstreamStatus":"$upstream_status",'
        '"userAgent":"$http_user_agent"'
        '}';

    access_log /dev/stdout bm_json;
    error_log  /dev/stderr warn;

    # WebSocket upgrade for the n8n editor's push channel.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ─── QA backend via domain (HTTP -> HTTPS redirect, ACME exempt) ───
    server {
        listen 80;
        server_name api.qa.poweredbyadvisors.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── QA backend via domain (HTTPS) ───
    server {
        listen 443 ssl;
        server_name api.qa.poweredbyadvisors.com;

        ssl_certificate     /etc/letsencrypt/live/api.qa.poweredbyadvisors.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.qa.poweredbyadvisors.com/privkey.pem;

        # Machine-to-machine only: the n8n workflow posts here as
        # http://backend-prod:8081/api/v1/batch-process-price-tables over the
        # internal Docker network, which does not pass through this proxy. It
        # takes no Firebase token, so blocking it here is what keeps it from
        # being writable by anyone who can reach the host.
        location /api/v1/batch-process-price-tables {
            deny all;
        }

        # n8n-only callback (no Firebase auth): n8n posts it over bm-network to
        # backend-*:8081 directly. EXACT match on purpose: a prefix match would
        # also block consumption-report-status/-result/-refresh, which clients use.
        location = /api/v1/consumption-report {
            deny all;
        }

        location /api/v1/ {
            proxy_pass http://backend-qa:8081/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Correlation id, always originated here. Any caller-supplied
            # X-Request-Id is deliberately overwritten: an untrusted client
            # could otherwise forge or collide ids across requests. The backend
            # echoes it back and forwards it to Docling / n8n, so one upload is
            # traceable end-to-end in Loki.
            proxy_set_header X-Request-Id $request_id;
        }

        # Uploads run Docling + DB writes synchronously and can exceed the 60s
        # default on large proposals; nginx then returned 504 even though the
        # backend went on to store the data.
        location = /api/v1/upload-price-proposal {
            proxy_pass http://backend-qa:8081/api/v1/upload-price-proposal;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }

        # Synchronous: backend -> n8n scrapes TotalEnergies, Docling extracts,
        # n8n posts the batch back. Takes 85-110s in PROD (Nov 2026); before the
        # 2026-11-16 lockdown BmWeb called :8081 directly, so the 60s default
        # was never hit. 300s leaves headroom.
        location = /api/v1/fetch-total-prices {
            proxy_pass http://backend-qa:8081/api/v1/fetch-total-prices;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }

        location /health {
            proxy_pass http://backend-qa:8081/health;
            proxy_set_header X-Request-Id $request_id;
        }

        location /metrics {
            deny all;
        }
    }

    # ─── PROD backend via domain (HTTP -> HTTPS redirect, ACME exempt) ───
    server {
        listen 80;
        server_name api.poweredbyadvisors.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── PROD backend via domain (HTTPS) ───
    server {
        listen 443 ssl;
        server_name api.poweredbyadvisors.com;

        ssl_certificate     /etc/letsencrypt/live/api.poweredbyadvisors.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.poweredbyadvisors.com/privkey.pem;

        # See the QA HTTPS block: machine-to-machine only.
        location /api/v1/batch-process-price-tables {
            deny all;
        }

        # n8n-only callback (no Firebase auth): n8n posts it over bm-network to
        # backend-*:8081 directly. EXACT match on purpose: a prefix match would
        # also block consumption-report-status/-result/-refresh, which clients use.
        location = /api/v1/consumption-report {
            deny all;
        }

        location /api/v1/ {
            proxy_pass http://backend-prod:8081/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }

        # See the QA HTTPS block: long synchronous uploads need > 60s.
        location = /api/v1/upload-price-proposal {
            proxy_pass http://backend-prod:8081/api/v1/upload-price-proposal;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }

        # See the QA HTTPS block: the n8n price import takes ~1.5-2 min.
        location = /api/v1/fetch-total-prices {
            proxy_pass http://backend-prod:8081/api/v1/fetch-total-prices;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }

        location /health {
            proxy_pass http://backend-prod:8081/health;
            proxy_set_header X-Request-Id $request_id;
        }

        location /metrics {
            deny all;
        }
    }

    # ─── n8n PROD editor (HTTP -> HTTPS redirect, ACME exempt) ───
    server {
        listen 80;
        server_name n8n.poweredbyadvisors.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── n8n PROD editor (HTTPS) ───
    server {
        listen 443 ssl;
        server_name n8n.poweredbyadvisors.com;

        ssl_certificate     /etc/letsencrypt/live/n8n.poweredbyadvisors.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/n8n.poweredbyadvisors.com/privkey.pem;

        # Webhooks take no auth (fetch-user-consumption returns customer data
        # for any CUPS). Only the backend calls them, over bm-network.
        location ~ ^/webhook(-test|-waiting)?/ {
            deny all;
        }

        location / {
            proxy_pass http://n8n-prod:5678;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Manual runs and the push websocket stay open for minutes.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }

    # ─── n8n QA editor (HTTP -> HTTPS redirect, ACME exempt) ───
    server {
        listen 80;
        server_name n8n.qa.poweredbyadvisors.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── n8n QA editor (HTTPS) ───
    server {
        listen 443 ssl;
        server_name n8n.qa.poweredbyadvisors.com;

        ssl_certificate     /etc/letsencrypt/live/n8n.qa.poweredbyadvisors.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/n8n.qa.poweredbyadvisors.com/privkey.pem;

        # Webhooks take no auth (fetch-user-consumption returns customer data
        # for any CUPS). Only the backend calls them, over bm-network.
        location ~ ^/webhook(-test|-waiting)?/ {
            deny all;
        }

        location / {
            proxy_pass http://n8n-qa:5678;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Manual runs and the push websocket stay open for minutes.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }

    # ─── Catch-all for :80 (raw IP / unknown hosts). Serves ACME challenges so
    # certbot can issue certs for new names before their vhost exists, and
    # closes everything else without a response. No backend is reachable here:
    # clients must use https://api.* / https://api.qa.* (2026-11-16). ───
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 444;
        }
    }

    # ─── QA backend, port-based. Published on 127.0.0.1 only (local checks). ───
    server {
        listen 81;
        server_name _;

        # Machine-to-machine only: the n8n workflow posts here as
        # http://backend-prod:8081/api/v1/batch-process-price-tables over the
        # internal Docker network, which does not pass through this proxy. It
        # takes no Firebase token, so blocking it here is what keeps it from
        # being writable by anyone who can reach the host.
        location /api/v1/batch-process-price-tables {
            deny all;
        }

        # n8n-only callback (no Firebase auth): n8n posts it over bm-network to
        # backend-*:8081 directly. EXACT match on purpose: a prefix match would
        # also block consumption-report-status/-result/-refresh, which clients use.
        location = /api/v1/consumption-report {
            deny all;
        }

        location /api/v1/ {
            proxy_pass http://backend-qa:8081/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }

        # See the QA HTTPS block: long synchronous uploads need > 60s.
        location = /api/v1/upload-price-proposal {
            proxy_pass http://backend-qa:8081/api/v1/upload-price-proposal;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }

        # See the QA HTTPS block: the n8n price import takes ~1.5-2 min.
        location = /api/v1/fetch-total-prices {
            proxy_pass http://backend-qa:8081/api/v1/fetch-total-prices;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }

        location /health {
            proxy_pass http://backend-qa:8081/health;
            proxy_set_header X-Request-Id $request_id;
        }

        location /metrics {
            deny all;
        }
    }
}
