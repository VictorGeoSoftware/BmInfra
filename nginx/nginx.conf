# ============================================================
# Routing:
#   :80  server_name api.qa.poweredbyadvisors.com -> QA   backend (backend-qa:8081)
#   :80  default (catch-all)                      -> PROD backend (backend-prod:8081)
#   :81  legacy port-based QA access              -> QA   backend (backend-qa:8081)
#
# /.well-known/acme-challenge/ is served from /var/www/certbot so certbot
# (webroot plugin, run on the host) can issue Let's Encrypt certificates.
# Once the cert for api.qa.* exists, add a `listen 443 ssl` server block
# (see BmInfra TODO.md).
#
# n8n is reached directly on its published ports (5678 / 6678).
# ============================================================

events {
    worker_connections 1024;
}

http {
    sendfile on;
    client_max_body_size 50M;

    # The default 'combined' format omits $request_id, which would make Nginx
    # the one hop in the chain that cannot be correlated with the rest. Logged
    # as JSON so Promtail parses it into fields instead of regex-matching text.
    log_format bm_json escape=json
        '{'
        '"timestamp":"$time_iso8601",'
        '"requestId":"$request_id",'
        '"remoteAddr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bodyBytesSent":$body_bytes_sent,'
        '"requestTimeSeconds":$request_time,'
        '"upstreamAddr":"$upstream_addr",'
        '"upstreamStatus":"$upstream_status",'
        '"userAgent":"$http_user_agent"'
        '}';

    access_log /dev/stdout bm_json;
    error_log  /dev/stderr warn;

    # ─── QA backend via domain (HTTP -> HTTPS redirect, ACME exempt) ───
    server {
        listen 80;
        server_name api.qa.poweredbyadvisors.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── QA backend via domain (HTTPS) ───
    server {
        listen 443 ssl;
        server_name api.qa.poweredbyadvisors.com;

        ssl_certificate     /etc/letsencrypt/live/api.qa.poweredbyadvisors.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.qa.poweredbyadvisors.com/privkey.pem;

        location /api/v1/ {
            proxy_pass http://backend-qa:8081/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Correlation id: reuse the caller's if present, else Nginx's own
            # per-request id. The backend echoes it back and forwards it to
            # Docling / n8n, so one upload is traceable end-to-end in Loki.
            proxy_set_header X-Request-Id $request_id;
        }

        location /health {
            proxy_pass http://backend-qa:8081/health;
        }
    }

    # ─── PROD backend (catch-all until a PROD domain exists) ───
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /api/v1/ {
            proxy_pass http://backend-prod:8081/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Correlation id: reuse the caller's if present, else Nginx's own
            # per-request id. The backend echoes it back and forwards it to
            # Docling / n8n, so one upload is traceable end-to-end in Loki.
            proxy_set_header X-Request-Id $request_id;
        }

        location /health {
            proxy_pass http://backend-prod:8081/health;
            proxy_set_header X-Request-Id $request_id;
        }

        # Never expose Prometheus metrics publicly: they leak endpoint names and
        # traffic volumes. Prometheus scrapes over the internal Docker network.
        location /metrics {
            deny all;
        }
    }

    # ─── QA backend (legacy port-based access, keep for internal checks) ───
    server {
        listen 81;
        server_name _;

        location /api/v1/ {
            proxy_pass http://backend-qa:8081/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://backend-qa:8081/health;
            proxy_set_header X-Request-Id $request_id;
        }

        location /metrics {
            deny all;
        }
    }
}
